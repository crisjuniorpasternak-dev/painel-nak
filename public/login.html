<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Painel Comercial NAK</title>
<link rel="icon" href="/logo.png">
<style>
  :root { --laranja: #f26b1d; --preto: #141414; --texto-2: #5c5f66; --linha: #e7e7ea; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f4f5; font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif; color: var(--preto); padding: 16px; border-top: 6px solid var(--preto); }
  form { width: min(100%, 360px); background: #fff; border: 1px solid var(--linha); border-top: 4px solid var(--laranja); border-radius: 14px; padding: 28px 26px; display: grid; gap: 14px; }
  img { height: 56px; justify-self: start; }
  h1 { margin: 4px 0 0; font-size: 20px; }
  p { margin: 0; color: var(--texto-2); font-size: 13.5px; }
  label { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--texto-2); }
  input { font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid var(--linha); border-radius: 8px; width: 100%; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--laranja); outline-offset: 1px; }
  button { font: inherit; font-weight: 700; font-size: 15px; background: var(--preto); color: #fff; border: 0; border-radius: 8px; padding: 11px; cursor: pointer; }
  button:hover { background: var(--laranja); }
  .erro { color: #b91c1c; font-size: 13px; }
</style>
</head>
<body>
  <form method="post" action="/api/login">
    <img src="/logo.png" alt="NAK">
    <h1>Painel Comercial</h1>
    <p>Digite a senha da equipe para ver o painel.</p>
    <div style="display:grid;gap:6px"><label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="current-password" required autofocus></div>
    <p class="erro" id="erro" hidden>Senha incorreta. Tente de novo.</p>
    <button type="submit">Entrar</button>
  </form>
  <script>if (new URLSearchParams(location.search).has('erro')) document.getElementById('erro').hidden = false;</script>
</body>
</html>
