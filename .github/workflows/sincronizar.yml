# Sincronização com o CRM (e com a Omie, no painel paralelo).
# - Automática: incremental de hora em hora (o plano grátis da Vercel só roda cron 1x por dia; a completa diária vem da Vercel Cron).
# - Manual: aba Actions → "Sincronizar painel" → Run workflow (padrão: completa).
# Secrets do repositório:
#   PAINEL_URL e CRON_SECRET          painel principal (CRM)
#   PAINEL_OMIE_URL e CRON_SECRET_OMIE painel paralelo com a Omie (opcional; sem eles o passo é pulado)
name: Sincronizar painel
on:
  schedule:
    - cron: '7 10-23 * * 1-6'   # de hora em hora, 7h às 20h de Brasília, seg a sáb
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Tipo de sincronização'
        type: choice
        options: [completa, incremental]
        default: completa
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Chamar a sincronização
        env:
          TIPO: ${{ inputs.tipo || 'incremental' }}
          PAINEL_URL: ${{ secrets.PAINEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PAINEL_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Faltam os secrets PAINEL_URL e/ou CRON_SECRET"; exit 1; fi
          curl -sS --fail-with-body --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${PAINEL_URL%/}/api/sync?tipo=$TIPO"
          echo
  sync-omie:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Painel paralelo (CRM e Omie)
        env:
          TIPO: ${{ inputs.tipo || 'incremental' }}
          URL: ${{ secrets.PAINEL_OMIE_URL }}
          SEGREDO: ${{ secrets.CRON_SECRET_OMIE }}
        run: |
          if [ -z "$URL" ] || [ -z "$SEGREDO" ]; then echo "Painel paralelo não configurado (PAINEL_OMIE_URL/CRON_SECRET_OMIE); pulando."; exit 0; fi
          chama() { curl -sS --fail-with-body --max-time 320 -H "Authorization: Bearer $SEGREDO" "${URL%/}/api/sync?$1"; }
          chama "tipo=$TIPO"; echo
          # A carga completa da Omie pode precisar de mais de uma chamada: repete enquanto voltar "parcial":true.
          for i in $(seq 1 8); do
            R=$(chama "tipo=$TIPO&fonte=omie"); echo "$R"
            echo "$R" | grep -q '"parcial":true' || break
          done
